services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: digital_banking
      MYSQL_USER: banking_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ayanled/digital-banking-backend:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PROD_DB_URL: jdbc:mysql://db:3306/digital_banking
      PROD_DB_USER: banking_user
      PROD_DB_PASSWORD: ${DB_PASSWORD}
      CARD_PIN_ENCRYPTION_KEY: ${CARD_PIN_ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ayanled/digital-banking-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data: