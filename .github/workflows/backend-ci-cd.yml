name: Backend CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main


jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repository
              uses: actions/checkout@v4

            - name: Set up java 21
              uses: actions/setup-java@v4
              with:
                java-version: '21'
                distribution: 'temurin'
            - name: run backend tests
              working-directory: backend
              env:
                TEST_DB_URL: jdbc:mysql://localhost:3306/digital_banking_test
                TEST_DB_USER: testuser
                TEST_DB_PASSWORD: testpassword
                CORS_ALLOWED_ORIGIN: http://localhost:5173
              run: ./mvnw test
        services:
             mysql:
                image: mysql:8.4
                env:
                    MYSQL_DATABASE: digital_banking_test
                    MYSQL_USER: testuser
                    MYSQL_PASSWORD: testpassword
                    MYSQL_ROOT_PASSWORD: rootpassword
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
    build:
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: checkout repository
              uses: actions/checkout@v6
            - name: login docker hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Set up Qemu
              uses: docker/setup-qemu-action@v4

            - name: Set up docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: build and push backend
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/digital-banking-backend:latest

            - name: Build and push frontend
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/digital-banking-frontend:latest
    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to VPS
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME }}
                key: ${{ secrets.KEY }}
                port: ${{ secrets.PORT }}
                script: |
                    cd /root/digital-banking-system
                    docker compose pull
                    docker compose up -d
