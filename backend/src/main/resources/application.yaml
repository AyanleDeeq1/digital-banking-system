spring:
  config:
    import: "optional:file:./secrets.yaml"
  application:
    name: digital-banking-system
  datasource: 
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  
  

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
app:
  card-pin:
    encryption-key: ${CARD_PIN_ENCRYPTION_KEY}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}

# Duplicate-key messages and bind/extract logs can expose simulated card data.
logging:
  level:
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
